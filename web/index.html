<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>FutPontos</title><link rel="stylesheet" href="style.css"></head>
<body><header class="top"><div><strong>FutPontos</strong><span id="groupName">Carregando grupo...</span></div><select id="groupSelect" aria-label="Selecionar grupo"></select></header><main><section class="hero"><p>RANKING DO CICLO</p><h1 id="cycleName">Carregando...</h1><small>Desempenho individual do seu grupo</small></section><section class="card"><div class="card-head"><h2>Ranking</h2><span id="rankingCount"></span></div><ol id="ranking"><li>Carregando atletas...</li></ol></section><section class="card admin"><h2>Registrar desempenho</h2><form id="performanceForm"><label>Atleta<select id="athlete" required></select></label><div class="metrics"><label>Gols<input name="gols" type="number" min="0" value="0"></label><label>Defesas<input name="defesas" type="number" min="0" value="0"></label><label>Vitórias<input name="vitorias" type="number" min="0" value="0"></label><label>Empates<input name="empates" type="number" min="0" value="0"></label><label>Infrações<input name="infracoes" type="number" min="0" value="0"></label></div><button>Salvar registro</button><p id="feedback" role="status"></p></form></section></main><script src="app.js"></script></body></html>
